name: CI

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyvalhalla==3.9.1 -r places/requirements.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: python -m pytest places scripts -q
      # Run as "curl | bash", the installer must be read in full before it
      # starts (see the note at the top of install.sh).
      - name: Installer is safe to pipe into bash
        run: |
          bash -n scripts/install.sh
          [ "$(grep -v '^$' scripts/install.sh | tail -n 1)" = 'main "$@"' ]

  # The Docker images the server runs, built as the server builds them, so a
  # change upstream (a base image dropping a library) shows here, not mid-deploy.
  server-images:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - name: Map tools image (osmium must load)
        run: docker build -t blueroute-places places
      - name: Map tools run on a tiny map
        run: |
          python3 - <<'EOF'
          # One named road in Camden, written as plain OSM XML.
          open("/tmp/tiny.osm", "w").write("""<?xml version='1.0' encoding='UTF-8'?>
          <osm version="0.6">
            <node id="1" version="1" lat="51.5444" lon="-0.1473"/>
            <node id="2" version="1" lat="51.5448" lon="-0.1469"/>
            <way id="1" version="1"><nd ref="1"/><nd ref="2"/>
              <tag k="highway" v="residential"/><tag k="name" v="Mutton Place"/></way>
          </osm>""")
          EOF
          docker run --rm -v /tmp:/data --entrypoint python blueroute-places extract_roads.py /data/tiny.osm /data/roads.txt.gz
          docker run --rm -v /tmp:/data --entrypoint python blueroute-places practical_speeds.py /data/tiny.osm /data/out.osm.pbf
      - name: Caddyfile is valid (HTTPS depends on it)
        run: |
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" -e DOMAIN=route.example.org \
            -e ACME_EMAIL=certificates@example.org caddy:2.10-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: API image starts and answers
        run: |
          docker build -t blueroute-api .
          docker run -d --name api -p 3000:3000 -e TFL_CLOSURES=0 blueroute-api
          for _ in $(seq 1 20); do curl -fsS localhost:3000/health && exit 0; sleep 1; done
          docker logs api
          exit 1
