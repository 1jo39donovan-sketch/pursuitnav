# The house-number search end to end, on a corner of London: the real
# scripts/build-geocoder.sh imports an Islington cut of the London extract
# into Nominatim and starts it with the API, then the smoke test's address
# checks run against it (no OS keys, no routing map). Runs when the geocoder
# or address search changes, or by hand from the Actions tab.
name: Geocoder

on:
  workflow_dispatch:
  push:
    paths:
      - server/nominatim.env
      - server/docker-compose.yml
      - server/scripts/build-geocoder.sh
      - server/scripts/smoke_london.py
      - server/src/nominatim.ts
      - server/src/addressSearch.ts
      - .github/workflows/geocoder.yml

permissions:
  contents: read

jobs:
  geocoder:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: An Islington cut of the London extract
        run: |
          sudo apt-get install -y -qq osmium-tool >/dev/null
          curl -fsSL --retry 3 -o /tmp/london.osm.pbf \
            https://download.geofabrik.de/europe/united-kingdom/england/greater-london-latest.osm.pbf
          mkdir -p data/osm
          # Caledonian Road and around, with whole boundaries so addresses get their city.
          osmium extract --overwrite -b -0.135,51.530,-0.100,51.560 -s smart -S types=multipolygon,boundary \
            /tmp/london.osm.pbf -o data/osm/region.osm.pbf
          ls -la data/osm

      - name: Build the geocoder with the real script
        run: |
          printf 'DOMAIN=localhost\nGEOCODER_CHECK=Caledonian Road\n' > .env
          sudo touch /var/log/blue-route-geocoder.log && sudo chmod 666 /var/log/blue-route-geocoder.log
          # As root, as on the server: Postgres owns the database folders it makes.
          sudo bash scripts/build-geocoder.sh 2>&1 | tee -a /var/log/blue-route-geocoder.log
          cat .env
          sudo docker compose ps

      - name: What Nominatim answers (raw), for the precision rules in src/nominatim.ts
        run: |
          ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$(docker compose ps -q nominatim)")
          echo "NOMINATIM=http://$ip:8080" >> "$GITHUB_ENV"
          python -m venv /tmp/venv && /tmp/venv/bin/pip install -q "osmium==4.*"
          # A number in the middle of a real addr:interpolation line, to check how it comes back.
          interp=$(/tmp/venv/bin/python - data/osm/region.osm.pbf <<'PY'
          import sys, osmium
          numbers = {n.id: (n.tags.get("addr:housenumber"), n.tags.get("addr:street"))
                     for n in osmium.FileProcessor(sys.argv[1], osmium.osm.NODE) if "addr:housenumber" in n.tags}
          for w in osmium.FileProcessor(sys.argv[1], osmium.osm.WAY):
              if w.tags.get("addr:interpolation") not in ("odd", "even", "all"):
                  continue
              (a, street), (b, _) = numbers.get(w.nodes[0].ref, (None, None)), numbers.get(w.nodes[-1].ref, (None, None))
              if a and b and a.isdigit() and b.isdigit() and street and abs(int(a) - int(b)) >= 4:
                  lo, hi = sorted((int(a), int(b)))
                  mid = lo + 2 if w.tags.get("addr:interpolation") != "all" else lo + 1
                  print(f"{mid} {street}")
                  break
          PY
          )
          echo "interpolated example: ${interp:-none in this cut}"
          for q in "53 Caledonian Road" "54 Caledonian Road" "Caledonian Road" "N7 8LA" ${interp:+"$interp"}; do
            echo "== $q"
            curl -fsS -G --data-urlencode "q=$q" -d format=jsonv2 -d addressdetails=1 -d limit=3 \
              -d polygon_geojson=1 -d polygon_threshold=0.0001 "http://$ip:8080/search" |
              python3 -c 'import json,sys; [print(json.dumps({**{k: r.get(k) for k in ("osm_type","osm_id","category","type","name")}, "shape": (r.get("geojson") or {}).get("type"), "number": (r.get("address") or {}).get("house_number")})) for r in json.load(sys.stdin)]'
          done
          echo "INTERP=$interp" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Address checks against the API (no OS keys)
        run: |
          npm ci
          NOMINATIM_URL="$NOMINATIM" TFL_CLOSURES=0 USAGE_DB= PORT=3999 npx tsx src/server.ts &
          for _ in $(seq 1 30); do curl -fsS localhost:3999/health && break; sleep 1; done
          echo
          /tmp/venv/bin/python scripts/smoke_london.py --api http://localhost:3999 --pbf data/osm/region.osm.pbf --addresses-only
          # The interpolated number: through the API it must be a point on the road, never the door.
          if [ -n "$INTERP" ]; then
            curl -fsS localhost:3999/v1/addresses -H 'content-type: application/json' -d "{\"query\": \"$INTERP\"}" |
              python3 -c 'import json,sys; a=json.load(sys.stdin)["addresses"]; print([(x["label"], x["precision"]) for x in a[:3]]); sys.exit(1 if any(x["precision"] == "door" and x["label"].startswith(sys.argv[1]) for x in a) else 0)' "$INTERP"
          fi
