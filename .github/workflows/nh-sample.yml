# National Highways sample: fetches the Road and Lane Closures API once,
# planned and unplanned, and prints the response's structure and a few
# records, so the closures parser is written against real data. Needs the
# repository secret NATIONAL_HIGHWAYS_KEY (a free key from
# developer.data.nationalhighways.co.uk, product "Road and Lane Closures").
# GitHub hides the key in the log; it is only ever sent in the header.
# Run from the Actions tab.
name: National Highways sample

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KEY: ${{ secrets.NATIONAL_HIGHWAYS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The server's own parser on the live feed
        working-directory: server
        env:
          NATIONAL_HIGHWAYS_KEY: ${{ secrets.NATIONAL_HIGHWAYS_KEY }}
        run: |
          npm ci --no-audit --no-fund >/dev/null
          npx tsx scripts/highways-check.ts
      - name: Fetch planned and unplanned closures and describe them
        run: |
          [ -n "$KEY" ] || { echo "No NATIONAL_HIGHWAYS_KEY secret yet."; exit 1; }
          now=$(date -u +%Y-%m-%dT%H:%M:%S)
          later=$(date -u -d '+2 days' +%Y-%m-%dT%H:%M:%S)
          before=$(date -u -d '-6 hours' +%Y-%m-%dT%H:%M:%S)
          for kind in planned unplanned; do
            if [ "$kind" = planned ]; then from=$now; to=$later; else from=$before; to=$now; fi
            echo "=================== $kind ($from to $to)"
            curl -sS -D headers.txt -o "$kind.json" -w "HTTP %{http_code}, %{size_download} bytes\n" \
              -H "Ocp-Apim-Subscription-Key: $KEY" \
              -H "X-Response-MediaType: application/json" \
              -H "X-Data-Format: DATEXII" \
              "https://api.data.nationalhighways.co.uk/roads/v2.0/closures?closureType=$kind&startDateTime=$from&endDateTime=$to"
            grep -i -E "^(content-type|x-next)" headers.txt || true
            python3 - "$kind.json" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1]))
          except Exception as e:
              print("not JSON:", e); print(open(sys.argv[1]).read()[:2000]); sys.exit(0)
          def shape(x, depth=0, path="$"):
              # Every path to a value, once, with an example: the structure, not the whole feed.
              seen = {}
              def walk(v, p):
                  if isinstance(v, dict):
                      for k, w in v.items(): walk(w, f"{p}.{k}")
                  elif isinstance(v, list):
                      for w in v[:3]: walk(w, f"{p}[]")
                  else:
                      seen.setdefault(p, repr(v)[:80])
              walk(x, path)
              return seen
          paths = shape(data)
          print(len(paths), "distinct paths")
          for p, ex in list(paths.items())[:400]:
              print(f"{p} = {ex}")
          # Two whole records, to see how one hangs together.
          def records(v):
              if isinstance(v, list): return v
              if isinstance(v, dict):
                  for w in v.values():
                      r = records(w)
                      if r: return r
              return []
          for r in records(data)[:2]:
              print("--- record"); print(json.dumps(r, indent=1)[:6000])
          PY
          done
      - name: Counts across the whole feed (all pages)
        run: |
          python3 <<'PY'
          import json, os, urllib.request, collections, datetime
          key = os.environ["KEY"]
          now = datetime.datetime.utcnow()
          fmt = "%Y-%m-%dT%H:%M:%S"
          def fetch(url):
              req = urllib.request.Request(url, headers={"Ocp-Apim-Subscription-Key": key, "X-Response-MediaType": "application/json", "X-Data-Format": "DATEXII"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r), r.headers.get("x-next")
          def walk_locs(loc, out):
              if isinstance(loc, dict):
                  for k, v in loc.items():
                      if k == "posList" and isinstance(v, str):
                          out.append(v)
                      else:
                          walk_locs(v, out)
              elif isinstance(loc, list):
                  for v in loc: walk_locs(v, out)
          BOXES = {"London": (51.28, 51.70, -0.52, 0.34), "Kent": (50.90, 51.50, 0.03, 1.46), "Essex": (51.45, 52.10, -0.02, 1.30)}
          for kind, start, end in (("planned", now, now + datetime.timedelta(days=2)), ("unplanned", now - datetime.timedelta(hours=6), now)):
              url = f"https://api.data.nationalhighways.co.uk/roads/v2.0/closures?closureType={kind}&startDateTime={start.strftime(fmt)}&endDateTime={end.strftime(fmt)}"
              c = {n: collections.Counter() for n in ("recordKey", "mgmtType", "validity", "cause", "locKeys", "srs", "region", "regionClosed", "laneFlags")}
              pages = sits = recs = 0
              examples = []
              while url and pages < 40:
                  data, url = fetch(url)
                  pages += 1
                  for sit in data.get("D2Payload", {}).get("situation", []):
                      sits += 1
                      for rec in sit.get("situationRecord", []):
                          recs += 1
                          for rk, r in rec.items():
                              c["recordKey"][rk] += 1
                              t = (r.get("roadOrCarriagewayOrLaneManagementType") or {}).get("value")
                              c["mgmtType"][t] += 1
                              c["validity"][(r.get("validity") or {}).get("validityStatus")] += 1
                              c["cause"][(r.get("cause") or {}).get("causeType")] += 1
                              loc = r.get("locationReference") or {}
                              c["locKeys"][",".join(sorted(loc.keys()))] += 1
                              lists = []
                              walk_locs(loc, lists)
                              regions = set()
                              for pl in lists:
                                  nums = pl.split()
                                  for i in range(0, len(nums) - 1, 2):
                                      lat, lng = float(nums[i]), float(nums[i + 1])
                                      for name, (s, n, w, e) in BOXES.items():
                                          if s <= lat <= n and w <= lng <= e: regions.add(name)
                              for g in regions:
                                  c["region"][g] += 1
                                  if t and t != "laneClosures": c["regionClosed"][f"{g}:{t}"] += 1
                              if regions and t in ("roadClosed", "carriagewayClosures") and len(examples) < 4:
                                  ex = dict(r); ex["locationReference"] = "(omitted)"
                                  examples.append(ex)
              print(f"=== {kind}: {pages} pages, {sits} situations, {recs} records")
              for n, cnt in c.items():
                  print(f"  {n}: {dict(cnt.most_common(25))}")
              for ex in examples:
                  print("  --- full-closure example in region"); print(json.dumps(ex, indent=1)[:3000])
          PY
