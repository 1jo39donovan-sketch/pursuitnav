# Map check: photographs the live web app's map close in at a few known
# places (stations and lines, police and A&E badges, the satellite look),
# kept as a download on the run (Artifacts), not committed. Run from the
# Actions tab after a change to what the map draws goes live.
name: Map check

on:
  push:
    paths:
      - tools/map-check.mjs
      - .github/workflows/map-check.yml
  workflow_dispatch:
    inputs:
      url:
        description: Web app to photograph
        default: https://bluerouteapp.com/app/
      names:
        description: Places to look for in the server's places file (;-separated)
        default: Squires Court;Quadrant House

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install a browser
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Is the server's data in step, and are these places in it?
        env:
          NAMES: ${{ inputs.names || 'Squires Court;Quadrant House' }}
          DOMAIN: ${{ vars.SERVER_DOMAIN }}
        run: |
          curl -fsS "https://$DOMAIN/health" | python3 -c "import json,sys; h=json.load(sys.stdin); print('server data:', h.get('data'), '· version', h.get('version'))" || true
          curl -fsS --compressed "https://$DOMAIN/v1/places-data" -o places.txt || true
          head -1 places.txt || true
          IFS=';' read -ra list <<< "$NAMES"
          for n in "${list[@]}"; do
            echo "--- $n"
            grep -i -- "^$n|" places.txt | head -5 || echo "(not in the places file)"
          done
      - name: Are these places in the newest published data (what the server takes next)?
        env:
          NAMES: ${{ inputs.names || 'Squires Court;Quadrant House' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list -R "$GITHUB_REPOSITORY" --limit 30 --json tagName --jq '[.[] | select(.tagName | startswith("data-"))][0].tagName')
          echo "newest data release: $tag"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p 'places.tar.zst*' -D rel
          cat rel/places.tar.zst* | tar --zstd -xO ./places.txt.gz | gunzip > newest.txt
          head -1 newest.txt
          IFS=';' read -ra list <<< "$NAMES"
          for n in "${list[@]}"; do
            echo "--- $n"
            grep -i -- "^$n|" newest.txt | head -5 || echo "(not in the newest places file)"
          done
      - name: Photograph the map
        run: node tools/map-check.mjs "${{ inputs.url || 'https://bluerouteapp.com/app/' }}" map-check
      # Small copies in the log too, for reading where artifacts can't be downloaded.
      - name: Print small copies
        if: always()
        run: |
          sudo apt-get install -y -qq imagemagick >/dev/null 2>&1 || true
          set +e
          for f in map-check/*.png; do
            echo "=== IMAGE $(basename "$f" .png)"
            convert "$f" -resize 600x -quality 70 jpg:- | base64
            echo
            echo "=== END"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: map-check
          path: map-check
          retention-days: 14
