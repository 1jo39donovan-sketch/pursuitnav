# Rents and sets up the Blue Route server on Hetzner Cloud, then waits until
# it answers over HTTPS. Run it from the Actions tab ("Run workflow").
# One-off setup (accounts, secrets) is in DEPLOY.md.
name: Deploy server

on:
  workflow_dispatch:
    inputs:
      recreate:
        description: "Delete the existing server and build a fresh one (nothing officers rely on is stored on it)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency: deploy-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The map build (20–40 min) and then the house-number import (see the wait step).
    timeout-minutes: 200
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
      OS_NAMES_KEY: ${{ secrets.OS_NAMES_KEY }}
      OS_PLACES_KEY: ${{ secrets.OS_PLACES_KEY }}
      TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
      STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
      DOMAIN: ${{ vars.SERVER_DOMAIN }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      NAME: blue-route
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check settings
        run: |
          missing=0
          [ -n "$HCLOUD_TOKEN" ] || { echo "::error::Add the HCLOUD_TOKEN secret (DEPLOY.md, step 2)."; missing=1; }
          [ -n "$DOMAIN" ] || { echo "::error::Add the SERVER_DOMAIN variable, e.g. blueroute-yourname.duckdns.org (DEPLOY.md, step 3)."; missing=1; }
          case "$DOMAIN" in
            *.duckdns.org) [ -n "$DUCKDNS_TOKEN" ] || { echo "::error::SERVER_DOMAIN is a DuckDNS name: add the DUCKDNS_TOKEN secret."; missing=1; } ;;
          esac
          exit $missing

      - name: Install the Hetzner command-line tool
        run: |
          curl -fsSL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz | tar -xz hcloud
          sudo mv hcloud /usr/local/bin/
          hcloud version

      - name: Check the Hetzner token
        run: |
          if ! hcloud server-type list -o noheader -o columns=name > types.txt 2> check.log; then
            cat check.log
            if grep -qiE 'unauthorized|unable to authenticate|invalid token|token' check.log; then
              echo "::error::Hetzner refused the HCLOUD_TOKEN secret. Make a new API token (Read & Write) in the Blue Route project and paste it into the secret again (DEPLOY.md, step 2)."
            else
              echo "::error::Couldn't reach Hetzner with HCLOUD_TOKEN (message above)."
            fi
            exit 1
          fi
          echo "Token works. Server types on offer: $(tr '\n' ' ' < types.txt)"

      - name: Create the server
        id: server
        run: |
          if [ "${{ inputs.recreate }}" = "true" ] && hcloud server describe "$NAME" >/dev/null 2>&1; then
            echo "Deleting the old server"
            hcloud server delete "$NAME"
          fi

          if hcloud server describe "$NAME" >/dev/null 2>&1; then
            echo "Server $NAME already exists; leaving it as it is (it updates itself nightly)."
          else
            # First boot runs the installer unattended. Only the domain and the
            # OS keys (and contact email) go to the server; the DuckDNS token stays here.
            {
              echo '#!/bin/bash'
              printf 'export DOMAIN=%q OS_NAMES_KEY=%q OS_PLACES_KEY=%q CONTACT_EMAIL=%q TFL_APP_KEY=%q STATS_TOKEN=%q BRANCH=%q\n' "$DOMAIN" "$OS_NAMES_KEY" "$OS_PLACES_KEY" "$CONTACT_EMAIL" "$TFL_APP_KEY" "$STATS_TOKEN" "$BRANCH"
              printf 'URL=%q\n' "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${BRANCH}/server/scripts/install.sh"
              # Download first, then run: piping curl into bash ran an empty
              # script, and reported success, whenever the download failed
              # (as it can at first boot, before the network is fully up).
              cat <<'BOOT'
          LOG=/var/log/blue-route-install.log
          for attempt in $(seq 1 30); do
            curl -fsSL -o /root/blue-route-install.sh "$URL" >>"$LOG" 2>&1 && break
            echo "== couldn't download the installer (attempt $attempt); retrying in 10 s" >>"$LOG"
            sleep 10
          done
          if [ -s /root/blue-route-install.sh ]; then
            bash /root/blue-route-install.sh >>"$LOG" 2>&1
            code=$?
          else
            echo "== gave up downloading the installer from $URL" >>"$LOG"
            code=1
          fi
          # Lets the wait step stop early, and show why, if the install fails.
          echo "== install finished with exit code $code" >>"$LOG"
          BOOT
            } > user-data.sh
            sed -i 's/^          //' user-data.sh

            # A one-off key, held only by this run, so it can show the install
            # log if something goes wrong. Taken off the server once it's up.
            ssh-keygen -q -t ed25519 -N "" -C blue-route-deploy -f deploy_key
            KEY_NAME="blue-route-deploy-${GITHUB_RUN_ID}"
            hcloud ssh-key create --name "$KEY_NAME" --public-key-from-file deploy_key.pub >/dev/null
            ssh_args=(--ssh-key "$KEY_NAME")
            if [ -n "$SSH_PUBLIC_KEY" ]; then
              hcloud ssh-key describe blue-route-admin >/dev/null 2>&1 ||
                hcloud ssh-key create --name blue-route-admin --public-key "$SSH_PUBLIC_KEY"
              ssh_args+=(--ssh-key blue-route-admin)
            fi

            # Cheapest first; small plans sell out at times, so try a few.
            created=0
            for type in cx23 cax11 cx33 cax21; do
              for location in nbg1 fsn1 hel1; do
                echo "Trying $type in $location"
                if hcloud server create --name "$NAME" --type "$type" --image ubuntu-24.04 --location "$location" \
                     --user-data-from-file user-data.sh "${ssh_args[@]}" > create.log 2>&1; then
                  created=1
                  echo "Created $type in $location"
                  break 2
                fi
                cat create.log
                # Sold out or not offered there: try the next one. Anything
                # else (account, permissions, limits) won't fix itself.
                if ! grep -qiE 'unavailable|not available|resource_unavailable|unsupported|not supported|not found|placement|deprecated' create.log; then
                  if grep -qiE 'forbidden|read.only|permission' create.log; then
                    echo "::error::The HCLOUD_TOKEN is read-only. Make a new token with Read & Write permission (DEPLOY.md, step 2)."
                  elif grep -qiE 'limit' create.log; then
                    echo "::error::Hetzner's limit for new accounts stopped this (message above). Check the Hetzner console for a notice, or ask Hetzner support to raise it."
                  else
                    echo "::error::Hetzner refused to create the server (message above). New accounts sometimes need their verification or payment method finished first: check the Hetzner console."
                  fi
                  exit 1
                fi
              done
            done
            # Only needed while creating the server; the key itself stays with this run.
            hcloud ssh-key delete "$KEY_NAME" >/dev/null || true
            [ "$created" = 1 ] || { echo "::error::Hetzner had no suitable server available. Try again later."; exit 1; }
          fi

          IP=$(hcloud server ip "$NAME")
          IP6=$(hcloud server ip --ipv6 "$NAME" 2>/dev/null || true)
          { echo "ip=$IP"; echo "ip6=$IP6"; } >> "$GITHUB_OUTPUT"
          echo "Server IP: $IP${IP6:+ and $IP6}"

      - name: Point the domain at the server
        env:
          IP: ${{ steps.server.outputs.ip }}
          IP6: ${{ steps.server.outputs.ip6 }}
        run: |
          case "$DOMAIN" in
            *.duckdns.org)
              SUB=${DOMAIN%.duckdns.org}
              # IPv6 too: a stale AAAA record sends phones on IPv6 mobile networks to the wrong place.
              result=$(curl -fsS "https://www.duckdns.org/update?domains=${SUB}&token=${DUCKDNS_TOKEN}&ip=${IP}&ipv6=${IP6}")
              [ "$result" = "OK" ] || { echo "::error::DuckDNS refused the update. Check DUCKDNS_TOKEN and that ${SUB} is one of your DuckDNS domains."; exit 1; }
              echo "$DOMAIN now points at $IP${IP6:+ and $IP6}"
              ;;
            *)
              echo "Make sure $DOMAIN has an A record pointing at $IP. Waiting for it…"
              for _ in $(seq 1 40); do
                [ "$(dig +short A "$DOMAIN" @1.1.1.1 | tail -n 1)" = "$IP" ] && { echo "OK"; exit 0; }
                sleep 30
              done
              echo "::error::$DOMAIN doesn't point at $IP. Add the A record and run this again."
              exit 1
              ;;
          esac

      - name: Wait for the server to be ready
        env:
          IP: ${{ steps.server.outputs.ip }}
          IP6: ${{ steps.server.outputs.ip6 }}
        run: |
          echo "Installing and building London's routing map and places (usually 20–40 minutes),"
          echo "then the house-number search (Nominatim import, measured in README.md)."
          # On the server, through the one-off key (only for a server made by this run).
          remote() {
            [ -f deploy_key ] || return 1
            ssh -i deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 \
              -o LogLevel=ERROR "root@$IP" "$@" 2>/dev/null
          }
          status() { remote "bash -s $1" < server/scripts/deploy-status.sh; }
          tidy() { remote "sed -i '/blue-route-deploy/d' /root/.ssh/authorized_keys" || true; }
          # Hetzner firewalls, if any, filter traffic before the server's own (ufw).
          echo "Hetzner firewalls in this project:"
          hcloud firewall list 2>&1 | sed 's/^/    /'
          down=0
          moved=0
          # 170 minutes: the map build, then the Nominatim import after it (they can't
          # overlap on a 4 GB server). On the first measured run they took the
          # times in README.md; this leaves room for a slower box or download.
          for i in $(seq 1 170); do
            health=$(curl -fsS -m 10 "https://${DOMAIN}/health" 2>/dev/null || true)
            if grep -q '"routing":true' <<<"$health" && grep -q '"places":true' <<<"$health" &&
               { grep -q '"nominatim":true' <<<"$health" || ! grep -q '"addresses"' <<<"$health"; }; then
              echo "https://${DOMAIN} is up, with routing, places and house-number search: $health"
              # The import's measurements (time, memory, database size), for README.md.
              echo "::group::Server state and geocoder measurements"
              status 20 || echo "(can't reach the server over SSH)"
              echo "::endgroup::"
              tidy
              exit 0
            fi
            # A server still on older code only reports ok; it updates itself overnight.
            if grep -q '"ok":true' <<<"$health" && ! grep -q '"routing"' <<<"$health"; then
              echo "https://${DOMAIN} is up (older version: it can't report whether the map is built yet)."
              tidy
              exit 0
            fi
            # From outside: where the name points, and whether HTTPS answers
            # straight from the server's IP (so DNS and the server can be told apart).
            dns=$(dig +short A "$DOMAIN" @1.1.1.1 | tail -n 1)
            dns6=$(dig +short AAAA "$DOMAIN" @1.1.1.1 | tail -n 1)
            byip=$(curl -sS -m 10 -o /dev/null -w '%{http_code}' --resolve "${DOMAIN}:443:${IP}" "https://${DOMAIN}/health" 2>&1 || true)
            echo "::group::$i min: https://${DOMAIN}/health ${health:-not answering} | DNS ${dns:-none}${dns6:+ / $dns6} (server $IP) | HTTPS to $IP: $byip"
            report=$(status 10 || echo "(can't reach the server over SSH)")
            echo "$report"
            echo "::endgroup::"
            if [ -n "$dns6" ] && [ -n "$IP6" ] && [ "$dns6" != "$IP6" ]; then
              echo "::warning::$DOMAIN's IPv6 record is $dns6, not this server ($IP6): phones on IPv6 networks would miss it."
            fi
            if [ -n "$dns" ] && [ "$dns" != "$IP" ]; then
              moved=$((moved + 1))
              echo "::warning::$DOMAIN points at $dns, not this server ($IP)."
              if [ "$moved" -ge 3 ]; then
                echo "::error::Something keeps changing $DOMAIN to $dns. It's usually a DuckDNS updater (an app on a computer, a router setting or a script) set up for this domain: turn it off, or give it another domain. The server itself is $IP."
                status 100 || true
                exit 1
              fi
              case "$DOMAIN" in
                *.duckdns.org) curl -fsS "https://www.duckdns.org/update?domains=${DOMAIN%.duckdns.org}&token=${DUCKDNS_TOKEN}&ip=${IP}&ipv6=${IP6}" >/dev/null &&
                  echo "Pointed $DOMAIN back at $IP." ;;
              esac
            fi
            state=$(grep -o '^STATUS=.*' <<<"$report" | tail -n 1 | cut -d= -f2)
            case "$state" in
              install-failed | install-empty)
                echo "::error::The server's install ${state#install-}. Details:"
                status 100 || true
                exit 1
                ;;
              container-down)
                # Twice in a row: a container restarting once (as the map build does) isn't a failure.
                down=$((down + 1))
                if [ "$down" -ge 2 ]; then
                  echo "::error::A container on the server has stopped or keeps restarting. Its logs:"
                  status 100 || true
                  exit 1
                fi
                ;;
              *) down=0 ;;
            esac
            sleep 60
          done
          echo "::error::Not fully ready after 170 minutes (last answer: ${health:-none}). The server's state:"
          status 100 || echo "(couldn't reach it over SSH)"
          exit 1

      # Real London cases against the live server: one-way streets (Stroud
      # Green Road and its neighbours), a bus gate, and address search (a
      # door from OpenStreetMap, a postcode, and 54 Caledonian Road).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: London smoke test
        timeout-minutes: 20
        run: bash server/scripts/smoke-london.sh "https://${DOMAIN}"

      - name: Summary
        if: success()
        env:
          IP: ${{ steps.server.outputs.ip }}
        run: |
          {
            echo "## Blue Route server is up"
            echo ""
            echo "- Address: https://${DOMAIN}"
            echo "- Server IP: ${IP}"
            echo "- London smoke test: passed"
            echo "- Next: run the **Android app** workflow to build the app pointed at it."
          } >> "$GITHUB_STEP_SUMMARY"
