# Builds London, Kent and Essex's map and search data each week on GitHub's machines (free
# for a public repository, and far bigger than the server) and publishes them
# as a release, data-YYYYMMDD-HHMM. Servers download the newest one daily
# (server/scripts/fetch-data.sh) instead of building it themselves: minutes
# instead of two hours, with nothing competing with officers' requests.
#
# What's built (the same scripts a server would run, server/scripts):
#   - the routing map: Valhalla tiles with travel speeds (map-build.sh)
#   - the places and named-roads lists the app keeps offline (map-build.sh)
#   - the map phones keep for no signal: tiles, styles, fonts (offline-map.sh)
#   - the house-number search: a Nominatim database (geocoder-import.sh),
#     London only for now (Kent's and Essex's would need a bigger server)
# All of it is OpenStreetMap data (© OpenStreetMap contributors, ODbL),
# already public; no officer or search data is involved.
name: Map data

on:
  schedule:
    # Sundays 01:00 UTC: Geofabrik's London extract is out by then.
    - cron: "0 1 * * 0"
    # Mondays: a second chance, only if Sunday's didn't publish (see "fresh").
    - cron: "0 1 * * 1"
  workflow_dispatch:
  # A change to this workflow on main builds and publishes at once, so it's
  # tried for real. Only main: a branch (a Dependabot update, a pull request)
  # mustn't publish data that servers then download. Run by hand on a branch
  # (workflow_dispatch), it builds everything and publishes nothing.
  push:
    branches: [main]
    paths: [".github/workflows/data.yml"]

permissions:
  contents: write
  issues: write

concurrency:
  group: map-data
  cancel-in-progress: false

jobs:
  # On Monday's schedule, build only if no data was published in the last two
  # days (Sunday's failed: the London extract gave 404 on 22 Nov 2026).
  fresh:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != schedule ] || [ "$(date -u +%u)" = 7 ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          newest=$(gh release list -R "$GITHUB_REPOSITORY" --limit 20 --json tagName,createdAt --jq '[.[] | select(.tagName | startswith("data-"))][0].createdAt')
          age=$(( ($(date +%s) - $(date -d "${newest:-1970-01-01}" +%s)) / 3600 ))
          echo "Newest data release: ${newest:-none}, ${age} hours old"
          if [ "$age" -gt 48 ]; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "build=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: fresh
    if: needs.fresh.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: server
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Room to build (toolchains this job doesn't use)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .

      - name: Tools
        run: |
          printf 'DOMAIN=localhost\n' > .env
          docker compose build places

      - name: Routing map and places
        run: |
          start=$(date +%s)
          bash scripts/map-build.sh
          echo "MAP_MINUTES=$(( ($(date +%s) - start + 59) / 60 ))" >> "$GITHUB_ENV"
          du -sh data/valhalla-next data/places-next

      - name: Offline map for phones
        id: offline
        # It downloads coastline and water shapes from outside servers, which
        # can be down (3 Nov: "No route to host" twice). The routing map and
        # places must still go out: last week's offline map is used instead.
        continue-on-error: true
        run: |
          start=$(date +%s)
          bash scripts/offline-map.sh
          echo "OFFLINE_MINUTES=$(( ($(date +%s) - start + 59) / 60 ))" >> "$GITHUB_ENV"
          echo "OFFLINE_MB=$(python3 -c 'import json; print(round(json.load(open("data/places-next/offline/manifest.json"))["bytes"] / 1e6))')" >> "$GITHUB_ENV"

      - name: Last week's offline map, if this week's couldn't be built
        if: steps.offline.outcome == 'failure'
        run: |
          prev=$(gh release list --limit 20 --json tagName --jq '.[].tagName' | grep '^data-' | sort -r | head -1)
          [ -n "$prev" ] || { echo "No earlier data release to take the offline map from"; exit 1; }
          echo "Taking the offline map from $prev"
          rm -rf "$RUNNER_TEMP/prev" && sudo rm -rf data/places-next/offline && mkdir -p "$RUNNER_TEMP/prev"
          gh release download "$prev" --pattern 'places.tar.zst.part*' --dir "$RUNNER_TEMP/prev"
          # The map build's folder belongs to root (its container wrote it).
          cat "$RUNNER_TEMP"/prev/places.tar.zst.part* | sudo tar --zstd -x -C data/places-next ./offline
          test -s data/places-next/offline/map.pmtiles
          echo "OFFLINE_MINUTES=0 (last week's, from $prev)" >> "$GITHUB_ENV"
          echo "OFFLINE_MB=$(python3 -c 'import json; print(round(json.load(open("data/places-next/offline/manifest.json"))["bytes"] / 1e6))')" >> "$GITHUB_ENV"

      - name: House-number search
        run: |
          # As root, as on a server: the database's files belong to its container's postgres user.
          sudo env BUILD_REPORT="$RUNNER_TEMP/geocoder.json" GEOCODER_THREADS=4 bash scripts/geocoder-import.sh ./data/nominatim/a
          cat "$RUNNER_TEMP/geocoder.json"

      - name: Package
        run: |
          sudo bash scripts/data-package.sh ./data/nominatim/a data/release "$RUNNER_TEMP/geocoder.json"
          ls -la data/release

      - name: What's in it
        run: |
          # Rows per region (area numbers: London 0–32, Kent 33–45, Essex 46–59), so a build that lost one shows.
          for f in places roads; do
            sudo zcat "data/places-next/$f.txt.gz" | tail -n +2 | python3 -c "
          import sys
          col = 4 if '$f' == 'places' else 1
          n = [0, 0, 0]
          for line in sys.stdin:
              a = int(line.split('|')[col])
              n[0 if a < 33 else 1 if a < 46 else 2] += 1
          print('$f: London', n[0], 'Kent', n[1], 'Essex', n[2])
          assert all(n), 'a region has no rows'
          "
          done
          echo "lines: $(sudo zcat data/places-next/lines.txt.gz 2>/dev/null | tail -n +2 | cut -d'|' -f1 | sort -u | wc -l) lines, $(sudo zcat data/places-next/lines.txt.gz 2>/dev/null | tail -n +2 | wc -l) stretches"

      - name: Publish
        if: github.ref == 'refs/heads/main'
        run: |
          tag="data-$(date -u +%Y%m%d-%H%M)"
          {
            echo "London, Kent and Essex map data built $(date -u '+%d %b %Y %H:%M') UTC for BlueRoute servers."
            echo
            echo "Servers download this themselves (server/scripts/fetch-data.sh); there's nothing to install by hand."
            echo "Map build: ${MAP_MINUTES} min. Offline map: ${OFFLINE_MB} MB in ${OFFLINE_MINUTES} min. House-number search: $(cat "$RUNNER_TEMP/geocoder.json")"
            echo
            echo "Map data © OpenStreetMap contributors, under the Open Database License."
          } > "$RUNNER_TEMP/notes.md"
          # GitHub's API now and then answers 500 (4 Nov): try again rather than lose
          # a 40-minute build, removing any half-made release first.
          for try in 1 2 3 4; do
            if gh release create "$tag" data/release/* --title "Map data $(date -u +%Y-%m-%d)" \
              --notes-file "$RUNNER_TEMP/notes.md" --prerelease --latest=false; then
              echo "Published $tag"
              exit 0
            fi
            echo "Publishing failed (try $try); trying again shortly"
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            sleep $((try * 30))
          done
          exit 1

      - name: Keep the newest three
        if: github.ref == 'refs/heads/main'
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^data-' | sort -r | tail -n +4 |
            while read -r old; do gh release delete "$old" --yes --cleanup-tag; echo "Deleted $old"; done

  # A scheduled build that fails opens an issue (GitHub emails the owner), so
  # a stale map is noticed in days, not when the uptime check's 9 days run out;
  # the next good build closes it.
  alert:
    needs: [fresh, build]
    if: always() && github.event_name == 'schedule' && needs.fresh.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          gh label create map-build --repo "$GITHUB_REPOSITORY" --color D93F0B --description "Opened and closed by the weekly map build" >/dev/null 2>&1 || true
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label map-build --json number --jq '.[0].number // empty')
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "${{ needs.build.result }}" = success ]; then
            [ -n "$open" ] && gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "This week's map data is built and published: $run"
            exit 0
          fi
          [ -n "$open" ] && { gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "Failed again: $run"; exit 0; }
          gh issue create --repo "$GITHUB_REPOSITORY" --label map-build --title "Weekly map build failed" --body "The scheduled map data build failed: $run

          The server keeps the last good map, so routes still work on older roads and places. A Monday build tries again if Sunday's failed; otherwise run **Map data** from the Actions tab, or ask Claude to look at the log."
