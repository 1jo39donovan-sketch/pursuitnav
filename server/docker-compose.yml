# Blue Route server: Valhalla routing, the API, Nominatim for house-number
# search, and Caddy for HTTPS.
# See README.md for first-time setup.

services:
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.9.1
    restart: unless-stopped
    volumes:
      - ./data/valhalla:/custom_files
    environment:
      # Serve the tiles scripts/build-map.sh built (it adds travel speeds
      # first, so Valhalla never downloads the map itself).
      use_tiles_ignore_pbf: "True"
      build_admins: "True"
      build_time_zones: "True"
      server_threads: "2"
    # Valhalla logs slow requests in full, coordinates included. Keep no logs.
    logging:
      driver: none

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - valhalla
    volumes:
      - ./data/places:/data/places:ro
      # Opt-in learning totals and the learned speeds the weekly map build reads.
      - ./data/learned:/data/learned
      # Usage counts (daily totals; hashed install IDs, deleted after 30 days).
      - usage:/data/usage
    environment:
      VALHALLA_URL: http://valhalla:8002
      # Address search. OS Names (free OS OpenData key): postcodes, roads, places.
      OS_NAMES_KEY: ${OS_NAMES_KEY:-}
      # Our own Nominatim (house numbers); build-geocoder.sh sets it once built.
      NOMINATIM_URL: ${NOMINATIM_URL:-}
      # OS Places (paid, optional): flats and named buildings. Leave empty to go without.
      OS_PLACES_KEY: ${OS_PLACES_KEY:-}
      # Contact address on the /privacy and /support pages.
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      # Free key from https://api-portal.tfl.gov.uk; live closures work without one but may be throttled.
      TFL_APP_KEY: ${TFL_APP_KEY:-}
      # 1 accepts opt-in learning uploads. Do the privacy steps in docs/ROADMAP.md first.
      LEARNING: ${LEARNING:-0}
      # The code version running (update.sh sets it), shown by GET /health.
      VERSION: ${VERSION:-}
      # Bearer token for GET /stats (usage counts); /stats is off without it.
      STATS_TOKEN: ${STATS_TOKEN:-}

  # House numbers and streets from OpenStreetMap, for address search. Only on
  # the internal network (no ports), and no logs: searches are addresses.
  # scripts/build-geocoder.sh imports the London extract into a fresh
  # database each week and then starts this on it; it's in the "geocoder"
  # profile (COMPOSE_PROFILES in .env, set by that script) so it isn't
  # started before there's a database to serve.
  nominatim:
    image: mediagis/nominatim:5.3
    profiles: ["geocoder"]
    restart: unless-stopped
    shm_size: 1g
    env_file: nominatim.env
    volumes:
      - ./data/osm:/osm:ro
      - ${NOMINATIM_DATA:-./data/nominatim/a}:/var/lib/postgresql/16/main
    # Measured serving use is in README.md; this leaves Valhalla its share of 4 GB.
    mem_limit: 1g
    # Postgres shuts down cleanly given time.
    stop_grace_period: 60s
    logging:
      driver: none

  # Map tools (places list, travel speeds), run by scripts/build-map.sh and
  # scripts/build-places.sh, not by `docker compose up`.
  places:
    build: ./places
    profiles: ["tools"]
    volumes:
      - ./data:/data

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env to the server's domain name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  usage:
  caddy_data:
  caddy_config:
